[package]
name = "taskvim"
version = "0.3.0"
edition = "2021"
description = "A vim-motions-driven terminal task / project / course manager"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "5"
rand = "0.8"

[profile.release]
lto = true
strip = true
opt-level = "z"
